[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix6-bridge"
version = "0.1.0"
description = "Runs Phoenix 6 requests from a microcontroller (CANBusRP2040) on Talon FX devices"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    # The firmware is generated for this exact version (schema.json)
    "phoenix6==26.3.0",
    "pyserial>=3.5",
]

[project.scripts]
phoenix6-bridge = "phoenix6_bridge.__main__:main"

[tool.setuptools]
packages = ["phoenix6_bridge"]

[tool.setuptools.package-data]
phoenix6_bridge = ["schema.json"]
