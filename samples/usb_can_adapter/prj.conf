# CAN controller (MCP25625 via the mcp25625_pico or mcp25625_arduino shield)
CONFIG_CAN=y
CONFIG_CAN_ACCEPT_RTR=y

# slcan protocol over USB CDC ACM
CONFIG_SLCAN=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="CANBusRP2040"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="CANBusRP2040 slcan USB-CAN adapter"
# The Zephyr project VID/PID defaults are only meant for testing. Use your own
# CONFIG_CDC_ACM_SERIAL_VID / CONFIG_CDC_ACM_SERIAL_PID for distributed devices.

# Serial number for the USB descriptor and the slcan N command
CONFIG_HWINFO=y

# Status LED
CONFIG_GPIO=y

# Logging goes to the console UART (GP0/GP1 on a Pico), not to the USB port
CONFIG_LOG=y
CONFIG_USBD_LOG_LEVEL_ERR=y
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y

# The MCP25625 has only two receive buffers; leave plenty of room to absorb
# bursts while the host is busy.
CONFIG_SLCAN_RX_QUEUE_SIZE=256
