# CAN controller (MCP25625 via the mcp25625_pico or mcp25625_arduino shield)
CONFIG_CAN=y
CONFIG_CAN_ACCEPT_RTR=y

# USB port 1: slcan, the host's SocketCAN interface (slcand) for Phoenix 6
CONFIG_SLCAN=y
CONFIG_SLCAN_RX_QUEUE_SIZE=256

# USB port 2: Phoenix 6 requests to the host bridge
CONFIG_PHOENIX6=y

CONFIG_SERIAL=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_HWINFO=y

# Shell on the console UART (GP0/GP1 on a Pico)
CONFIG_SHELL=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_SHELL_STACK_SIZE=3072

CONFIG_LOG=y
CONFIG_USBD_LOG_LEVEL_ERR=y
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
