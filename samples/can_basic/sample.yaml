sample:
  name: MCP25625 basic CAN example
  description: |
    Sends a counter frame every second and prints all received frames using
    the standard Zephyr CAN API on top of the MCP25625 driver.
common:
  tags:
    - can
  build_only: true
tests:
  sample.canbus_rp2040.can_basic:
    extra_args: SHIELD=mcp25625_pico
    platform_allow:
      - rpi_pico
      - rpi_pico2/rp2350a/m33
    integration_platforms:
      - rpi_pico
  sample.canbus_rp2040.can_basic.loopback:
    extra_args: SHIELD=mcp25625_pico
    platform_allow:
      - rpi_pico
    extra_configs:
      - CONFIG_SAMPLE_CAN_LOOPBACK=y
  # Any board with an Arduino R3 header, e.g. Nordic, STM32 Nucleo, NXP FRDM
  sample.canbus_rp2040.can_basic.arduino:
    extra_args: SHIELD=mcp25625_arduino
    platform_allow:
      - nrf52840dk/nrf52840
    modules:
      - hal_nordic
