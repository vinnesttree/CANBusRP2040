sample:
  name: Kraken motor tool
  description: |
    Shell commands to drive a Kraken X60/X44 by PWM, show its motor data and
    list CTR Electronics devices (Kraken / Talon FX) seen on the CAN bus.
common:
  tags:
    - can
    - pwm
    - kraken
  build_only: true
  extra_args: SHIELD=mcp25625_pico
  platform_allow:
    - rpi_pico
  integration_platforms:
    - rpi_pico
tests:
  sample.canbus_rp2040.kraken_tool: {}
