sample:
  name: Kraken motor tool
  description: |
    Shell commands to drive a Kraken X60/X44 by PWM, show its motor data and
    list CTR Electronics devices (Kraken / Talon FX) seen on the CAN bus.
common:
  tags:
    - can
    - pwm
    - kraken
  build_only: true
tests:
  sample.canbus_rp2040.kraken_tool:
    extra_args: SHIELD=mcp25625_pico
    platform_allow:
      - rpi_pico
      - rpi_pico2/rp2350a/m33
    integration_platforms:
      - rpi_pico
  # Any board with an Arduino R3 header, e.g. Nordic, STM32 Nucleo, NXP FRDM
  sample.canbus_rp2040.kraken_tool.arduino:
    extra_args: SHIELD=mcp25625_arduino
    platform_allow:
      - nrf52840dk/nrf52840
    modules:
      - hal_nordic
